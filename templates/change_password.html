{% extends base_template %}
{% block title %}Change Password{% endblock %}
{% block extra_styles %}
<style>
    .password-panel {
        max-width: 560px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #eadff8;
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 6px 18px rgba(111, 66, 193, 0.08);
    }
    .password-panel h2 {
        font-family: 'Poppins', sans-serif;
        font-size: 1.2rem;
        margin-bottom: 6px;
        color: #2d1b4e;
    }
    .password-panel p {
        color: #6b7280;
        margin-bottom: 10px;
        font-size: 0.92rem;
    }
    .password-grid {
        display: grid;
        gap: 8px;
    }
</style>
{% endblock %}
{% block content %}
<div class="password-panel">
    <h2>Update Password</h2>
    <p>Enter your current password and set a new one.</p>
    <form method="post">
        {% csrf_token %}
        <div class="password-grid">
            <p>
                <label>Current Password</label><br>
                <input type="password" name="current_password" required>
            </p>
            <p>
                <label>New Password</label><br>
                <input type="password" name="new_password" required>
            </p>
            <p>
                <label>Confirm New Password</label><br>
                <input type="password" name="confirm_password" required>
            </p>
        </div>
        <button class="btn success" type="submit">Update Password</button>
        <a class="btn secondary" href="{% url home_url_name %}">Back</a>
    </form>
</div>
{% endblock %}
