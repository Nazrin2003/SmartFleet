{% extends "base_manager.html" %}
{% block title %}Create Trip{% endblock %}
{% block content %}
<h2>Create Trip</h2>
<form method="post">
    {% csrf_token %}
    <p>
        <label>Driver</label><br>
        <select name="driver_id" required>
            <option value="">Select Driver</option>
            {% for driver in drivers %}
            <option value="{{ driver.id }}">{{ driver.user.username }} ({{ driver.assigned_vehicle.plate_number }})</option>
            {% endfor %}
        </select>
    </p>
    <p><label>Origin</label><br><input type="text" name="origin" required></p>
    <p><label>Destination</label><br><input type="text" name="destination" required></p>
    <p><label>Load</label><br><input type="text" name="load_details"></p>
    <p><label>Estimated Distance (km)</label><br><input type="number" step="0.01" name="estimated_distance_km"></p>
    <p><label>Expected Fuel (liters)</label><br><input type="number" step="0.01" name="expected_fuel_liters"></p>
    <p><label>Estimated Time (hours)</label><br><input type="number" step="0.01" name="estimated_time_hours"></p>
    <p><label>Scheduled Date</label><br><input type="date" name="scheduled_date"></p>
    <button class="btn" type="submit">Create</button>
    <a class="btn secondary" href="{% url 'trips_page' %}">Cancel</a>
</form>
{% endblock %}
