{% extends "base_manager.html" %}
{% load static %}
{% block title %}Assign Vehicle{% endblock %}
{% block extra_styles %}
<style>
    .hero-assign { background-image: url('{% static "images/fleet6.jpg" %}'); min-height: 145px; display:flex; align-items:center; }
    .form-panel { background: rgba(255,255,255,.97); border:1px solid #eadff8; border-radius:12px; padding:14px; max-width:700px; }
</style>
{% endblock %}
{% block content %}
<section class="hero hero-assign">
    <div>
        <h2>Assign Vehicle</h2>
        <p>Assign available fleet units to {{ driver.user.username }}.</p>
    </div>
</section>
<div class="form-panel">
<form method="post">
    {% csrf_token %}
    <p>
        <label>Available Vehicles</label><br>
        <select name="vehicle_id" required>
            <option value="">Select Vehicle</option>
            {% for vehicle in vehicles %}
                <option value="{{ vehicle.id }}">{{ vehicle.plate_number }} - {{ vehicle.model_name }}</option>
            {% endfor %}
        </select>
    </p>
    <button class="btn" type="submit">Assign</button>
    <a class="btn secondary" href="{% url 'driver_detail' driver.id %}">Cancel</a>
</form>
</div>
{% endblock %}
