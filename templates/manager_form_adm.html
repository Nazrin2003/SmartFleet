{% extends "base_admin.html" %}
{% block title %}{% if mode == 'edit' %}Edit Manager{% else %}Add Manager{% endif %}{% endblock %}
{% block content %}
<h2 style="margin-bottom:10px;">{% if mode == 'edit' %}Edit Manager{% else %}Add Manager{% endif %}</h2>
<form method="post" style="display:grid;gap:10px;max-width:440px;">
    {% csrf_token %}
    <div><label>Username</label><br><input type="text" name="username" required value="{{ manager.user.username|default:'' }}"></div>
    <div><label>First Name</label><br><input type="text" name="first_name" value="{{ manager.user.first_name|default:'' }}"></div>
    <div><label>Last Name</label><br><input type="text" name="last_name" value="{{ manager.user.last_name|default:'' }}"></div>
    <div><label>Password {% if mode == 'edit' %}(leave blank to keep){% endif %}</label><br><input type="password" name="password" {% if mode != 'edit' %}required{% endif %}></div>
    <div>
        <button class="btn success" type="submit">Save</button>
        <a class="btn secondary" href="{% url 'manager_list_adm' %}">Cancel</a>
    </div>
</form>
{% endblock %}
